name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Mise (pinned toolchain)
        uses: jdx/mise-action@v2

      - name: Install Dependencies (Wally)
        run: wally install

      - name: Run StyLua (Formatting Gate)
        run: stylua --check src/

      - name: Run Selene (Lint Gate — errors block, warnings reported)
        run: selene --allow-warnings src/

      - name: Verify Rojo Build
        run: rojo build default.project.json --output build/ZundamonsKitchen.rbxl

      - name: Cross-check Config References (catalog ↔ scatter ↔ registry ↔ remotes)
        run: python3 scripts/check_config_crossrefs.py

      - name: Generate Sourcemap (Luau-LSP tooling)
        run: rojo sourcemap default.project.json -o build/sourcemap.json

      - name: Upload Rojo Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rojo-build
          path: |
            build/ZundamonsKitchen.rbxl
            build/sourcemap.json
          if-no-files-found: error
          retention-days: 90